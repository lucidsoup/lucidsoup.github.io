<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="The SynthSoup cat above a bowl of soup">
<title>LucidSoup</title>
<!-- The cat is the real logo, not a redrawing of it.

     It is lifted pixel-for-pixel out of synthsoup/assets/soup-cat.gif, which
     is a 240x240 screen capture of the synth's display: frame 0, cropped to
     the head at x130 y78, the screen background keyed out, and the two rows
     of the filter-cutoff line that cross the muzzle (y138-139, #ff55d5)
     repaired from the rows either side so the tongue carries through. The
     body and the tail were cropped away because the cat in the GIF is
     holding a bowl of its own and this icon already has one.

     Embedded rather than referenced because an SVG used as a favicon does
     not load external images. Scaled by exactly 4 and rendered pixelated:
     it is pixel art and should look like pixel art, not like pixel art
     someone tried to smooth. 4x rather than 3x because a browser tab renders
     this at 16-32px, where the extra size is the difference between a face
     and a smudge — it was checked at both.

     The bowl below it is vector, and stays vector.

     Regenerate the cat with tools/extract-cat.py, then the PNGs with
     tools/icons.mjs. -->
<defs>
  <radialGradient id="bg" cx="50%" cy="38%" r="72%">
    <stop offset="0"   stop-color="#2a1256"/>
    <stop offset=".55" stop-color="#140a2e"/>
    <stop offset="1"   stop-color="#05040f"/>
  </radialGradient>
  <radialGradient id="broth" cx="42%" cy="28%" r="78%">
    <stop offset="0"   stop-color="#e2ff8c"/>
    <stop offset=".3"  stop-color="#8ae04b"/>
    <stop offset=".62" stop-color="#2fae8e"/>
    <stop offset="1"   stop-color="#0a4150"/>
  </radialGradient>
  <linearGradient id="bowl" x1="12%" y1="0%" x2="88%" y2="100%">
    <stop offset="0"   stop-color="#b79bff"/>
    <stop offset=".34" stop-color="#7d55e8"/>
    <stop offset=".72" stop-color="#4a239c"/>
    <stop offset="1"   stop-color="#23104f"/>
  </linearGradient>
  <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0"   stop-color="#d9caff"/>
    <stop offset=".45" stop-color="#9b7bff"/>
    <stop offset="1"   stop-color="#5e34b8"/>
  </linearGradient>
  <filter id="soft"   x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="softer" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="20"/></filter>
  <clipPath id="brothclip"><ellipse cx="256" cy="374" rx="176" ry="48"/></clipPath>
</defs>

<rect width="512" height="512" fill="url(#bg)"/>

<g filter="url(#softer)" opacity=".62">
  <circle cx="150" cy="130" r="118" fill="#8e4bff"/>
  <circle cx="372" cy="150" r="104" fill="#d44fb0"/>
  <circle cx="256" cy="430" r="126" fill="#1f7f8c"/>
</g>
<g fill="none" stroke="#b79bff" opacity=".13">
  <ellipse cx="256" cy="236" rx="206" ry="206" stroke-width="2"/>
  <ellipse cx="256" cy="236" rx="166" ry="172" stroke-width="2"/>
  <ellipse cx="256" cy="236" rx="126" ry="138" stroke-width="2"/>
</g>

<!-- a glow under the cat, so it belongs to the scene rather than sitting on it -->
<ellipse cx="256" cy="176" rx="220" ry="136" fill="#b021f6" opacity=".22" filter="url(#softer)"/>

<image x="46" y="40" width="420" height="272"
       style="image-rendering: pixelated; image-rendering: crisp-edges"
       href="data:image/png;base64,"/>

<!-- ===== bowl ===== -->
<ellipse cx="256" cy="494" rx="150" ry="26" fill="#04030c" opacity=".55" filter="url(#soft)"/>
<path d="M70 372 C70 372 86 490 130 512 C168 531 344 531 382 512 C426 490 442 372 442 372 Z" fill="url(#bowl)"/>
<path d="M96 380 C104 450 122 490 148 506 C128 504 110 492 100 478 C84 456 76 414 74 380 Z" fill="#e4d8ff" opacity=".42"/>
<path d="M418 380 C412 442 396 484 374 502 C398 492 414 470 424 440 C432 416 436 392 438 380 Z" fill="#6fe3e8" opacity=".2"/>
<ellipse cx="256" cy="374" rx="188" ry="54" fill="none" stroke="url(#rim)" stroke-width="13"/>
<ellipse cx="256" cy="372" rx="188" ry="54" fill="none" stroke="#f0e8ff" stroke-width="3.5" opacity=".5"/>
<ellipse cx="256" cy="374" rx="176" ry="48" fill="url(#broth)"/>
<g clip-path="url(#brothclip)">
  <g fill="none" stroke="#06343f" opacity=".32" stroke-linecap="round">
    <path d="M140 380 C172 350 262 346 322 364 C368 378 356 398 318 402" stroke-width="7"/>
    <path d="M172 396 C212 376 284 374 320 388" stroke-width="5"/>
  </g>
  <path d="M144 370 C178 342 266 338 326 356" fill="none" stroke="#e8ff9e" opacity=".45" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="256" cy="400" rx="170" ry="30" fill="#063542" opacity=".35"/>
  <g fill="none" stroke-linecap="round">
    <path d="M104 378 C126 364 152 372 162 388" stroke="#8a6a18" stroke-width="13" opacity=".55"/>
    <path d="M104 378 C126 364 152 372 162 388" stroke="#ffe9a8" stroke-width="9"/>
    <path d="M370 388 C390 372 414 376 422 390" stroke="#8a6a18" stroke-width="12" opacity=".5"/>
    <path d="M370 388 C390 372 414 376 422 390" stroke="#ffe9a8" stroke-width="8"/>
  </g>
  <circle cx="200" cy="398" r="9" fill="#dcff8e" opacity=".75"/>
  <circle cx="378" cy="366" r="7" fill="#bdf07a" opacity=".65"/>
</g>
</svg>

# fly launch --no-deploy  then  fly deploy
app = "lucidsoup-ripper"
primary_region = "lhr"

[build]

[env]
  PORT = "8080"
  RIPPER_MAX_SECONDS = "3600"
  RIPPER_MAX_CONCURRENT = "2"
  # RIPPER_ORIGIN is set to your site with: fly secrets set RIPPER_ORIGIN=https://www.lucidsoup.com
  # RIPPER_TOKEN likewise: fly secrets set RIPPER_TOKEN=$(openssl rand -hex 24)

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

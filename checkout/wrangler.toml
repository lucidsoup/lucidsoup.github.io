name = "lucidsoup-checkout"
main = "index.mjs"
compatibility_date = "2024-11-01"

# Orders, download tokens and the artist→Stripe-account map. One namespace;
# create it with `wrangler kv namespace create ORDERS` and paste the id here.
[[kv_namespaces]]
binding = "ORDERS"
id = "PUT_YOUR_KV_NAMESPACE_ID_HERE"

# The builds. Private bucket — nothing is ever served from it directly; the
# worker streams it only to a request carrying a valid, unexpired,
# not-used-up token.
[[r2_buckets]]
binding = "BUILDS"
bucket_name = "lucidsoup-builds"

[vars]
# Where the catalogue lives. Prices are read from here on every checkout, so
# this must be the real site and not a staging copy.
SITE_BASE = "https://www.lucidsoup.com"
# This worker's own public URL, used to build download links.
SELF_BASE = "https://lucidsoup-checkout.YOURSUBDOMAIN.workers.dev"
# Who may call it from a browser. Comma-separated, exact origins. Anything
# not on this list gets no CORS header and its preflight is refused.
ALLOWED_ORIGINS = "https://www.lucidsoup.com,https://lucidsoup.github.io"
# How long a download link lives, and how many times it may be used.
DOWNLOAD_HOURS = "72"
MAX_DOWNLOADS = "5"
# How long a fetched catalogue is reused before being read again.
CATALOGUE_TTL_MS = "60000"

# Secrets are NOT here. Set them with `wrangler secret put <NAME>`:
#   STRIPE_SECRET_KEY      sk_live_… (start with sk_test_…)
#   STRIPE_WEBHOOK_SECRET  whsec_… from the webhook endpoint you create
#   ADMIN_TOKEN            a long random string; it is what admin.html sends

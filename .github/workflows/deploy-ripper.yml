# Deploys ripper/ to Fly.io.
#
# Dormant until a FLY_API_TOKEN secret exists, and green while it is dormant:
# this repository has had a scheduled workflow fail every day for want of a
# secret before, and one red cross a day teaches you to stop looking.
#
#   1. flyctl auth signup        (or log in)
#   2. flyctl tokens create deploy -a vst-library
#   3. paste it into Settings → Secrets and variables → Actions as FLY_API_TOKEN
#   4. optionally add RIPPER_TOKEN (a key for the service) and RIPPER_ORIGIN
#
# Then push anything under ripper/, or run this workflow by hand.
name: Deploy ripper

on:
  push:
    branches: [main]
    paths: ['ripper/**', '.github/workflows/deploy-ripper.yml']
  workflow_dispatch:

concurrency:
  group: deploy-ripper
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reports which of the three secrets this job can see, and nothing about
      # what is in them. The first run of this workflow went green and skipped
      # every step, and "skipped" on its own does not say which secret was
      # missing or where it should have been.
      - name: Is there anywhere to deploy to?
        id: gate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          RIPPER_TOKEN: ${{ secrets.RIPPER_TOKEN }}
          RIPPER_ORIGIN: ${{ secrets.RIPPER_ORIGIN }}
        run: |
          have() { if [ -n "$1" ]; then echo "set"; else echo "**not set**"; fi; }
          {
            echo "### What this job can see"
            echo ""
            echo "| secret | |"
            echo "|---|---|"
            echo "| \`FLY_API_TOKEN\` | $(have "$FLY_API_TOKEN") |"
            echo "| \`RIPPER_TOKEN\` | $(have "$RIPPER_TOKEN") |"
            echo "| \`RIPPER_ORIGIN\` | $(have "$RIPPER_ORIGIN") |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$FLY_API_TOKEN" ]; then
            {
              echo "No \`FLY_API_TOKEN\`, so there is nowhere to deploy to and every"
              echo "step below was skipped. Nothing failed."
              echo ""
              echo "It has to be a **repository secret**, under"
              echo "Settings → Secrets and variables → **Actions** → Repository secrets."
              echo "A repository *variable*, a *Dependabot* secret, or an *environment*"
              echo "secret will not be visible here. Connecting Fly to the repository"
              echo "through Fly's own GitHub integration is a different thing again and"
              echo "does not give this workflow a token."
              echo ""
              echo '```sh'
              echo "flyctl tokens create deploy -a vst-library"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "No FLY_API_TOKEN secret, so there is nowhere to deploy to yet."
            echo "See this run's summary. Nothing failed here."
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Install flyctl
        if: steps.gate.outputs.go == 'yes'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create the app if it is not there yet
        if: steps.gate.outputs.go == 'yes'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        working-directory: ripper
        run: |
          app=$(awk -F'"' '/^app *=/{print $2}' fly.toml)
          # Asking about this app directly, rather than grepping a list: the
          # pattern that did it would also have matched vst-library-2, and
          # the || true after it would have swallowed a real failure to create
          # and left the deploy to fail further on with a stranger message.
          if flyctl status -a "$app" >/dev/null 2>&1; then
            echo "$app already exists."
          else
            echo "Creating $app…"
            flyctl apps create "$app" --org personal
          fi

      - name: Set the service's own settings
        if: steps.gate.outputs.go == 'yes'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          RIPPER_TOKEN: ${{ secrets.RIPPER_TOKEN }}
          RIPPER_ORIGIN: ${{ secrets.RIPPER_ORIGIN }}
        working-directory: ripper
        run: |
          app=$(awk -F'"' '/^app *=/{print $2}' fly.toml)
          args=""
          [ -n "$RIPPER_TOKEN" ]  && args="$args RIPPER_TOKEN=$RIPPER_TOKEN"
          [ -n "$RIPPER_ORIGIN" ] && args="$args RIPPER_ORIGIN=$RIPPER_ORIGIN"
          if [ -n "$args" ]; then
            flyctl secrets set $args -a "$app" --stage
          fi
          if [ -z "$RIPPER_TOKEN" ]; then
            # RIPPER_ORIGIN is pinned in fly.toml, so the service is already
            # closed to other browsers. Nothing is closed to curl without a key.
            echo "::warning::No RIPPER_TOKEN secret. The service will answer anyone who finds its URL."
            {
              echo "> **No \`RIPPER_TOKEN\`.** The service answers anyone who finds its URL."
              echo "> The origin pinned in \`fly.toml\` stops other browsers; it does not stop curl."
              echo ">"
              echo '> ```sh'
              echo "> fly secrets set RIPPER_TOKEN=\$(openssl rand -hex 24) -a $app"
              echo '> ```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy
        if: steps.gate.outputs.go == 'yes'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        working-directory: ripper
        # remote-only: the build happens on Fly's builder, so this runner
        # needs no Docker of its own.
        run: flyctl deploy --remote-only

      - name: Say where it is
        if: steps.gate.outputs.go == 'yes'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        working-directory: ripper
        run: |
          app=$(awk -F'"' '/^app *=/{print $2}' fly.toml)
          echo "### Ripper deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Put this in the converter, under **Audio service**:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "https://$app.fly.dev" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          curl -fsS --max-time 30 "https://$app.fly.dev/health" >> "$GITHUB_STEP_SUMMARY" || \
            echo "(health check did not answer yet; it scales to zero and wakes on first call)" >> "$GITHUB_STEP_SUMMARY"

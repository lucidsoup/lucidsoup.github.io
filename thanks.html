<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="/icons/soup.svg">
    <link rel="apple-touch-icon" href="/icons/soup-180.png">
    <link rel="stylesheet" href="/lucid.css">
    <link rel="stylesheet" href="/stack.css">
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https: http:; connect-src 'self' blob: data: https: http: wss:; worker-src 'self' blob:; frame-src 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank you — LucidSoup</title>
    <meta name="robots" content="noindex">
    <meta name="description" content="Your download.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        [hidden] { display: none !important; }
        body {
            font-family: 'Arial', sans-serif; line-height: 1.6;
            color: var(--lucid-ink, rgba(255,255,255,.93));
            background: #0a0a0a; min-height: 100vh;
        }
        .wrap { max-width: 640px; margin: 0 auto; padding: 3.5rem 1.5rem 5rem; text-align: center; }
        h1 {
            font-family: 'Orbitron', monospace; font-size: clamp(1.8rem, 6vw, 2.8rem);
            letter-spacing: .05em; text-transform: uppercase; margin-bottom: .8rem;
        }
        p { color: var(--lucid-ink-dim, rgba(255,255,255,.74)); margin-bottom: 1rem; }
        .panel {
            margin-top: 2rem; padding: 1.6rem;
            border: 1px solid var(--lucid-pane-edge, rgba(255,255,255,.1));
            border-radius: var(--lucid-pane-radius, 16px);
            background: var(--lucid-pane, rgba(18,14,32,.72));
        }
        .get {
            display: inline-flex; align-items: center; justify-content: center;
            min-height: 52px; padding: 12px 32px; border-radius: 5px; text-decoration: none;
            border: 1px solid var(--lucid-accent-2, #8ae04b);
            background: rgba(138,224,75,.18); color: #d9ffb8;
            font-family: var(--lucid-mono); font-size: 13px;
            letter-spacing: .18em; text-transform: uppercase;
        }
        .get:hover { background: rgba(138,224,75,.3); }
        .small {
            font-family: var(--lucid-mono); font-size: 11px; letter-spacing: .06em;
            color: var(--lucid-ink-faint, rgba(255,255,255,.54)); margin-top: 1rem;
        }
        .err { color: var(--lucid-accent-3, #d44fb0); }
        /* A link on its own line is still something somebody has to hit with
           a thumb, so it gets a thumb's worth of height. */
        a.back {
            color: var(--lucid-accent, #9b7bff);
            display: inline-flex; align-items: center; min-height: 44px; padding: 0 10px;
        }
    </style>
</head>
<body>
    <main class="wrap" id="main" tabindex="-1">
        <h1 class="lucid-liquid-type">Thank you</h1>
        <p id="lead">Checking your order&hellip;</p>

        <div class="panel" id="panel" hidden>
            <p id="what"></p>
            <a class="get" id="get" href="#">Download</a>
            <p class="small" id="terms"></p>
        </div>

        <p class="small"><a class="back" href="/store.html">Back to the store</a></p>
    </main>

    <script src="/lucid.js" defer></script>
    <script src="/stack.js" defer></script>
    <script>
    /* The buyer's own page. It asks the checkout worker about one order, and
       the worker will only answer if the URL carries both the order id and
       the Stripe session id — the session id is handed to the buyer's browser
       by Stripe and to nobody else, so a guessed order number gets nothing.

       The download link itself is never put in this URL. It comes back from
       that call, so it does not end up in a browser history somebody else
       reads, or in a referrer, or in a link pasted into a chat. */
    (function () {
        'use strict';
        var lead = document.getElementById('lead');
        var panel = document.getElementById('panel');
        var what = document.getElementById('what');
        var get = document.getElementById('get');
        var terms = document.getElementById('terms');

        function fail(msg) {
            lead.className = 'err';
            lead.textContent = msg;
        }

        var q = new URLSearchParams(location.search);
        var order = q.get('order'), session = q.get('session');
        if (!order || !session) {
            fail('This page needs the link Stripe sent you back to. If you have paid and ' +
                 'cannot get here, write and the download will be reissued.');
            return;
        }

        fetch('checkout.json?t=' + Date.now())
            .then(function (r) { return r.ok ? r.json() : {}; })
            .then(function (cfg) {
                var base = String(cfg.base || '').replace(/\/+$/, '');
                if (!base) throw new Error('no checkout configured');
                return fetch(base + '/order?order=' + encodeURIComponent(order) +
                             '&session=' + encodeURIComponent(session));
            })
            .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
            .then(function (res) {
                if (!res.ok) { fail(res.j.error || 'That order could not be found.'); return; }
                if (res.j.status !== 'paid') {
                    // Stripe's webhook can land a second or two after the
                    // buyer does. Saying "not paid" at that moment would be
                    // both alarming and wrong.
                    lead.textContent = 'Payment received — just waiting for Stripe to confirm. ' +
                        'This page will keep checking.';
                    setTimeout(function () { location.reload(); }, 3000);
                    return;
                }
                lead.textContent = 'Paid. Here it is.';
                what.textContent = res.j.itemId;
                get.href = res.j.download;
                var days = Math.max(0, Math.round((res.j.expiresAt - Date.now()) / 36e5));
                terms.textContent = 'This link works for about ' + days + ' more hours, ' +
                    res.j.remaining + ' more download' + (res.j.remaining === 1 ? '' : 's') +
                    '. Keep the file; the link is not meant to last.';
                panel.hidden = false;
            })
            .catch(function () {
                fail('The checkout could not be reached. Your payment is fine — write and the ' +
                     'download will be sent over.');
            });
    })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="/icons/soup.svg">
    <link rel="apple-touch-icon" href="/icons/soup-180.png">
    <link rel="stylesheet" href="/lucid.css?v=20261125a">
    <link rel="stylesheet" href="/stack.css?v=20261125a">
<meta charset="UTF-8">
<script src="/secure.js?v=20261127a"></script>
<!-- Content Security Policy. GitHub Pages cannot send headers, so this is a
     <meta>, which means frame-ancestors is not available here — clickjacking
     still needs a real header this host will not send.

     What it buys: with PeerJS now served from this origin, no page loads a
     script from anywhere else, so script-src names no external host at all.
     An injected <script src="..."> is refused, as is a <base> that would
     re-point every relative URL, and <object>/<embed> entirely.

     What it does not buy: every page here has inline <script>, so
     'unsafe-inline' has to stay and injected *inline* script would still run.
     Removing it needs nonces, which need a server. connect-src and media-src
     stay wide because the whole point of the playground and the converter is
     fetching media the visitor names, including from their own service on
     localhost. wss: is listed separately because an `https:` source does
     NOT admit a wss: socket in Chrome — DrumSeek's peer connection was
     blocked until it was added, which a page load alone never showed. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https: http:; connect-src 'self' blob: data: https: http: wss:; worker-src 'self' blob:; frame-src 'self'; upgrade-insecure-requests">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LucidSoup — The Gallery</title>
<meta name="description" content="A gallery whose rooms do not add up.">
<style>
    :root {
        /* Pulled from lucid.css so the gallery is the same cyan as the rest of
           the site rather than its own near-miss. */
        --ink: var(--lucid-ink, #e8e8f0);
        --dim: var(--lucid-dim, #7a7a8c);
        --cyan: var(--lucid-accent, #8b6cf5);
        --mag: var(--lucid-accent-3, #d44fb0);
        --metre: 112px;          /* one "metre" of room, in px */
        --persp: 640px;          /* eye distance; JS reads this too */
    }
    * { box-sizing: border-box; }
    html, body {
        margin: 0; padding: 0; height: 100%; overflow: hidden;
        background: var(--lucid-bg-deep, #05050a); color: var(--ink);
        font-family: var(--lucid-mono, ui-monospace, SFMono-Regular, Menlo, 'Courier New', monospace);
        -webkit-text-size-adjust: 100%;
    }
    body { touch-action: none; }

    /* ===== the viewport into the room ===== */
    #stage {
        position: fixed; inset: 0;
        perspective: var(--persp);
        perspective-origin: 50% 50%;
        cursor: grab;
    }
    #stage.dragging { cursor: grabbing; }

    #camera {
        position: absolute; top: 50%; left: 50%;
        width: 0; height: 0;
        transform-style: preserve-3d;
        will-change: transform;
    }
    #room {
        position: absolute; top: 0; left: 0;
        width: 0; height: 0;
        transform-style: preserve-3d;
        will-change: transform;
    }

    .surface {
        position: absolute;
        /* Centred on the room origin before its own transform moves it out. */
        left: 50%; top: 50%;
        transform-origin: 50% 50%;
        background-color: var(--lucid-panel, #0b0b14);
        background-repeat: repeat;
        overflow: hidden;
        /* A seam-hiding hairline; CSS 3D leaves sub-pixel gaps at some angles. */
        outline: 1px solid var(--lucid-panel, #0b0b14);
    }
    /* Depth cue: without it, an untextured room reads as a flat rectangle. */
    .surface::after {
        content: ''; position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at 50% 50%,
                    rgba(0,0,0,0) 42%, rgba(0,0,0,.44) 100%);
    }
    .surface.lit::after { background: radial-gradient(ellipse at 50% 40%,
                    rgba(0,0,0,0) 45%, rgba(0,0,0,.35) 100%); }

    .surface > video, .surface > img, .surface > canvas.fill {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover; display: block;
    }

    /* ===== a framed piece hanging on a wall ===== */
    .frame {
        position: absolute; left: 50%; top: 46%;
        transform: translate(-50%, -50%);
        width: 62%; height: 58%;
        background: #000;
        border: 2px solid rgba(255,255,255,.14);
        box-shadow: 0 0 0 10px #07070d, 0 24px 60px rgba(0,0,0,.8),
                    0 0 50px rgba(139, 108, 245,.07);
        overflow: hidden;
        cursor: pointer;
    }
    .frame > video, .frame > img, .frame > canvas {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover; display: block;
    }
    .frame-cap {
        position: absolute; left: 0; right: 0; bottom: 0;
        padding: 6px 8px; font-size: 11px; letter-spacing: .06em;
        background: linear-gradient(transparent, rgba(0,0,0,.85));
        color: #cfcfe0; text-transform: lowercase;
        opacity: 0; transition: opacity .25s ease;
    }
    .frame:hover .frame-cap { opacity: 1; }
    .frame-empty {
        position: absolute; inset: 0; display: flex;
        align-items: center; justify-content: center;
        color: #2a2a3a; font-size: 30px;
    }

    /* ===== stairs =====
       A flight is treads and risers as real planes in the room, so the
       impossibility is something you look at rather than a number in a corner.
       Gravity is per-flight: four flights at four rotations is Relativity. */
    .flight { position: absolute; left: 50%; top: 50%; width: 0; height: 0;
              transform-style: preserve-3d; }
    .flight .tread, .flight .riser {
        position: absolute; left: 50%; top: 50%;
        transform-origin: 50% 50%;
        border: 1px solid rgba(139, 108, 245,.16);
    }
    .flight .tread {
        background: linear-gradient(rgba(139, 108, 245,.10), rgba(139, 108, 245,.03));
        box-shadow: inset 0 0 18px rgba(0,0,0,.6);
    }
    .flight .riser {
        background: linear-gradient(rgba(10,14,22,.82), rgba(0,0,0,.94));
        border-color: rgba(139, 108, 245,.16);
    }
    .flight.clickable { cursor: pointer; }
    .flight.clickable:hover .tread,
    .flight.clickable:focus-visible .tread {
        background: linear-gradient(rgba(138, 224, 75,.3), rgba(138, 224, 75,.1));
        border-color: rgba(138, 224, 75,.6);
    }
    .flight-label {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        font-size: 12px; letter-spacing: .3em; text-transform: uppercase;
        color: var(--cyan); text-shadow: 0 0 14px rgba(139, 108, 245,.75);
        white-space: nowrap; pointer-events: none;
    }
    /* A flight serving a different gravity is tinted, so the eye reads it as
       belonging to another "down" rather than as a mistake. */
    .flight.g1 .tread { background: linear-gradient(rgba(212, 79, 176,.12), rgba(212, 79, 176,.03)); border-color: rgba(212, 79, 176,.2); }
    .flight.g2 .tread { background: linear-gradient(rgba(138, 224, 75,.11), rgba(138, 224, 75,.03)); border-color: rgba(138, 224, 75,.2); }
    .flight.g3 .tread { background: linear-gradient(rgba(255,190,0,.12), rgba(255,190,0,.03)); border-color: rgba(255,190,0,.22); }
    .flight.g1 .flight-label { color: #ff6cff; text-shadow: 0 0 14px rgba(212, 79, 176,.7); }
    .flight.g2 .flight-label { color: #b6f58a; text-shadow: 0 0 14px rgba(138, 224, 75,.7); }
    .flight.g3 .flight-label { color: #ffd34d; text-shadow: 0 0 14px rgba(255,190,0,.7); }

    /* ===== a doorway ===== */
    .doorway {
        position: absolute; left: 50%; bottom: 0;
        transform: translateX(-50%);
        width: 38%; height: 72%;
        border-radius: 48% 48% 0 0 / 22% 22% 0 0;
        background:
            radial-gradient(ellipse at 50% 100%, rgba(139, 108, 245,.16), transparent 62%),
            #02020a;
        box-shadow: inset 0 0 44px rgba(0,0,0,.95),
                    0 0 0 2px rgba(139, 108, 245,.16),
                    0 0 34px rgba(139, 108, 245,.10);
        cursor: pointer;
        transition: box-shadow .3s ease;
    }
    .doorway:hover, .doorway:focus-visible {
        color: var(--lucid-accent-2, #8ae04b);
        box-shadow: inset 0 0 44px rgba(0,0,0,.9),
                    0 0 0 2px rgba(138, 224, 75,.5),
                    0 0 60px rgba(138, 224, 75,.3);
        outline: none;
    }
    .doorway-label {
        position: absolute; left: 50%; bottom: 14%;
        transform: translateX(-50%);
        font-size: 12px; letter-spacing: .3em; text-transform: uppercase;
        color: var(--cyan); opacity: .8; white-space: nowrap;
        text-shadow: 0 0 12px rgba(139, 108, 245,.6);
        pointer-events: none;
    }
    .doorway.tall { height: 82%; }

    /* A doorway on the floor or ceiling reads as a shaft, not an arch. */
    .doorway.shaft {
        width: 44%; height: 44%; top: 50%; bottom: auto;
        transform: translate(-50%, -50%);
        border-radius: 50%;
    }

    /* ===== manipulation ===== */
    /* Everything the viewer does to a room is one filter on this wrapper plus a
       transform on the room, so it costs nothing and composes freely. */
    #lens { position: absolute; inset: 0; transform-style: preserve-3d; }

    .surface.touched { animation: touched .5s ease-out; }
    @keyframes touched {
        0%   { box-shadow: inset 0 0 0 3px rgba(139, 108, 245,.9); }
        100% { box-shadow: inset 0 0 0 3px rgba(139, 108, 245,0); }
    }
    .surface.alterable { cursor: crosshair; }

    /* Echoes: copies of the room nested behind itself. Structure only — the
       media is stripped out of them, so they stay cheap. */
    .echo { position: absolute; left: 0; top: 0; width: 0; height: 0;
            transform-style: preserve-3d; pointer-events: none; }

    #fx {
        position: fixed; z-index: 55; left: 16px; top: 92px;
        display: flex; flex-direction: column; gap: 7px;
        pointer-events: auto;
    }
    .fx-row { display: flex; gap: 6px; align-items: center; }
    .fx-btn {
        background: rgba(212, 79, 176,.07); border: 1px solid rgba(212, 79, 176,.32);
        color: #c9a6ff; font: inherit; font-size: 10px; letter-spacing: .14em;
        text-transform: uppercase; padding: 7px 9px; border-radius: 3px;
        cursor: pointer; min-width: 40px; min-height: 34px;
        transition: background .18s, border-color .18s;
    }
    .fx-btn:hover, .fx-btn:focus-visible {
        background: rgba(212, 79, 176,.18); border-color: rgba(212, 79, 176,.7); outline: none;
    }
    .fx-btn.on { background: rgba(212, 79, 176,.26); border-color: rgba(212, 79, 176,.85); color: #fff; }
    .fx-val { color: #7a7a8c; font-size: 10px; min-width: 26px; }
    #fx-title { color: #7a7a8c; font-size: 10px; letter-spacing: .24em; text-transform: uppercase; }
    #fx.folded .fx-row:not(.always) { display: none; }

    @media (max-width: 640px) {
        /* 108px was the height of one row of exit chips. A room with five exits
           wraps them to two rows on a phone and the alter controls landed on
           top of them, so take the measured height instead (paintHUD writes it). */
        #fx { top: auto; bottom: calc(var(--hud-h, 108px) + 8px); left: 10px; right: 10px; }
        .fx-row { flex-wrap: wrap; }
        .fx-btn { font-size: 9px; padding: 7px; min-width: 34px; }
    }

    /* ===== plinth =====
       A room that holds part of the site shows a plinth. Clicking it leaves the
       gallery for that section, which is now the only route to it. */
    .plinths {
        position: absolute; left: 50%; bottom: 4%;
        transform: translateX(-50%);
        display: flex; gap: 10px; justify-content: center; width: 86%;
    }
    .plinth {
        flex: 1 1 0; min-width: 0; padding: 14px 16px;
        background: linear-gradient(rgba(0,0,0,.4), rgba(0,0,0,.88));
        border: 1px solid rgba(139, 108, 245,.34);
        border-radius: 3px; cursor: pointer; text-align: center;
        box-shadow: 0 0 34px rgba(139, 108, 245,.12), inset 0 0 26px rgba(0,0,0,.8);
        transition: border-color .25s, box-shadow .25s;
    }
    .plinth:hover, .plinth:focus-visible {
        border-color: rgba(138, 224, 75,.9);
        box-shadow: 0 0 52px rgba(138, 224, 75,.34), inset 0 0 26px rgba(0,0,0,.7);
        outline: none;
    }
    .plinth-title {
        font-size: 12px; letter-spacing: .26em; text-transform: uppercase;
        color: var(--cyan); text-shadow: 0 0 12px rgba(139, 108, 245,.6);
    }

    /* ===== travel fade ===== */
    #veil {
        position: fixed; inset: 0; background: #000; pointer-events: none;
        opacity: 0; transition: opacity .22s linear; z-index: 40;
    }
    #veil.on { opacity: 1; }

    /* ===== HUD ===== */
    .hud {
        position: fixed; z-index: 50; pointer-events: none;
        font-size: 12px; letter-spacing: .1em;
    }
    #hud-top {
        top: 0; left: 0; right: 0;
        /* The menu button is pinned to this corner on every page, so the
           readout has to stop short of it: without this, "altitude 0
           flights" ran underneath it on a phone. */
        padding: 14px 16px;
        padding-right: calc(16px + var(--lucid-chrome-slot, 52px));
        display: flex; align-items: flex-start; justify-content: space-between;
        gap: 12px;
        background: linear-gradient(rgba(0,0,0,.72), transparent);
    }
    #hud-room {
        font-family: var(--lucid-display, 'Orbitron', 'Arial Black', sans-serif);
        text-transform: uppercase; letter-spacing: .24em; font-size: 13px;
    }
    #hud-stats { text-align: right; color: var(--dim); font-size: 11px; line-height: 1.7; white-space: nowrap; }
    #hud-stats b { color: var(--ink); font-weight: normal; }
    /* The proof: altitude that cannot be squared with having come back. */
    #hud-stats .impossible b { color: var(--mag); text-shadow: 0 0 14px rgba(212, 79, 176,.6); }

    #hud-bottom {
        bottom: 0; left: 0; right: 0;
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
        background: linear-gradient(transparent, rgba(0,0,0,.78));
        display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        pointer-events: auto;
    }
    /* Exits are always listed here as buttons. 3D hit-testing on a phone is
       fiddly, so the gallery is fully navigable without touching the room. */
    .exit-chip {
        pointer-events: auto;
        background: rgba(139, 108, 245,.07);
        border: 1px solid rgba(139, 108, 245,.3);
        color: var(--cyan);
        padding: 9px 14px; border-radius: 3px;
        font: inherit; font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
        cursor: pointer; transition: background .2s, border-color .2s;
        min-height: 40px;
    }
    .exit-chip:hover, .exit-chip:focus-visible {
        background: rgba(138, 224, 75,.16); border-color: rgba(138, 224, 75,.65); outline: none;
    }
    .exit-chip .asc { color: var(--mag); margin-left: 6px; }
    /* Each exit is addressed, the way a plate on the Stack is. It costs nothing
       and it makes the HUD and the index read as one system rather than two. */
    .exit-chip[data-i] { position: relative; padding-left: 31px; }
    .exit-chip[data-i]::before {
        content: attr(data-i);
        position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
        font-size: 8.5px; letter-spacing: .1em; color: var(--lucid-ink-label);
    }
    #stack-open {
        margin-left: auto;
        border-color: rgba(155, 123, 255,.55);
        background: rgba(155, 123, 255,.10);
    }
    #leave {
        pointer-events: auto;
        background: none; border: 1px solid rgba(255,255,255,.2);
        color: var(--dim); padding: 9px 14px; border-radius: 3px;
        font: inherit; font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
        cursor: pointer; min-height: 40px;
    }
    #leave:hover { color: var(--ink); border-color: rgba(255,255,255,.45); }

    #hint {
        position: fixed; left: 50%; bottom: calc(var(--hud-h, 64px) + 12px);
        transform: translateX(-50%);
        z-index: 50; color: var(--dim); font-size: 11px; letter-spacing: .14em;
        pointer-events: none; opacity: 1; transition: opacity .6s ease;
        text-align: center; white-space: nowrap;
    }
    #hint.gone { opacity: 0; }
    /* One line of four clauses is 773px wide. On a 390px phone it ran off both
       edges and straight through the exit chips, so it read as damage rather
       than as help. Let it wrap, and sit it above everything else down there. */
    @media (max-width: 820px) {
        #hint {
            left: 12px; right: 12px; transform: none; white-space: normal;
            line-height: 1.7; letter-spacing: .1em;
            bottom: calc(var(--hud-h, 64px) + var(--fx-h, 0px) + 16px);
        }
    }

    /* ===== lightbox for a full piece ===== */
    #lb { position: fixed; inset: 0; background: rgba(0,0,0,.96); z-index: 60;
          display: none; align-items: center; justify-content: center; padding: 2rem; }
    #lb.on { display: flex; }
    #lb video { max-width: 92vw; max-height: 86vh; border-radius: 6px; }
    #lb-close { position: absolute; top: 14px; right: 20px; background: none; border: none;
                color: #fff; font-size: 34px; cursor: pointer; opacity: .75; line-height: 1; }

    #fail {
        position: fixed; inset: 0; display: none; z-index: 70;
        align-items: center; justify-content: center; flex-direction: column;
        gap: 14px; text-align: center; padding: 2rem; background: #05050a;
    }
    #fail.on { display: flex; }
    #fail a { color: var(--cyan); }

    @media (max-width: 640px) {
        :root { --metre: 86px; --persp: 460px; }
            #hud-room { font-size: 11px; letter-spacing: .2em; }
        .doorway-label { font-size: 10px; letter-spacing: .2em; }
    }
    @media (prefers-reduced-motion: reduce) {
        #veil { transition-duration: .01ms; }
        #camera, #room { transition: none !important; }
    }
</style>
</head>
<body data-lucid-no-return data-lucid-no-broth>

<!-- The gallery is a 3D room with no text in it, so the page's heading and
     its landmark both have to be stated rather than drawn. The h1 is for a
     screen reader and for the document outline; sighted visitors get the
     room. -->
<h1 class="lucid-sr">The Gallery</h1>

<main id="main" tabindex="-1">
<div id="stage" aria-label="Gallery">
    <div id="camera"><div id="lens"><div id="room"></div></div></div>
</div>

<div id="fx" class="folded"></div>

<div id="veil"></div>

<div class="hud" id="hud-top">
    <div>
        <div id="hud-room">—</div>
    </div>
    <div id="hud-stats"></div>
</div>

<div class="hud" id="hud-bottom"></div>
<div id="hint">drag to look · tap a doorway to travel · tap a wall to change it · <b>index</b> for everywhere at once</div>

<div id="lb"><button id="lb-close" aria-label="Close">&times;</button><video controls playsinline></video></div>

<div id="fail">
    <div>The gallery could not be loaded.</div>
    <div style="color:#7a7a8c;font-size:12px" id="fail-why"></div>
    <a href="index.html">back to the soup</a>
</div>

<script src="/gallery.js?v=20261127a"></script>
<script src="/lucid.js?v=20261125a" defer></script>
</main>
<script src="/stack.js?v=20261125a" defer></script>
</body>
</html>
